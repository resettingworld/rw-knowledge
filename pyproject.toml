[project]
name = "smart-local"
version = "1.0.0"
description = "Multimodal RAG Knowledge Engine using Gemma 4 E4B, EmbeddingGemma 2, On-Demand Loading & OpenAI-compatible SDK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "openai>=3.46.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.0.0",
    "pymupdf>=2.1",
    "pypdf>=7.0.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "python-multipart>=0.0.33",
    "rich>=15.0.0",
    "typer>=0.28.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
smart-local = "smart_local.cli:main"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
